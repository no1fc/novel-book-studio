interface:
  display_name: "소설책 제작"
  short_description: "소설·오른쪽 전면 삽화·일관된 캐릭터·웹툰·만화책 제작"
  default_prompt: "$novel-book-writer로 요청한 형식의 이야기를 제작해 주세요. 삽화 소설은 같은 캐릭터 기준을 공유하고 장면 그림을 오른쪽 독립 한 페이지로 배치하며, 본문·그림·목차·최종 렌더링을 검수해 주세요. 웹툰이나 만화 요청이면 패널 대본과 해당 형식으로 각색해 주세요."
policy:
  allow_implicit_invocation: true
